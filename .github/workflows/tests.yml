name: Pruebas Meritum-SENA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar configuración local
        run: python manage.py check
      - name: Comprobar migraciones
        run: python manage.py makemigrations --check --dry-run
      - name: Ejecutar pruebas
        run: python manage.py test
      - name: Verificar arranque de la demo web sin datos reales
        env:
          MERITUM_SENA_DEBUG: "false"
          MERITUM_SENA_DEMO_EFIMERA: "true"
          MERITUM_SENA_SECRET_KEY: "pruebas-ci-no-es-clave-de-produccion-0123456789-abcdefghijklmnop"
          MERITUM_SENA_DOCENTE_PASSWORD: "SoloPruebasDocente2026-1234567"
          MERITUM_SENA_ESTUDIANTE_PASSWORD: "SoloPruebasAlumno2026-1234567"
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput
          python manage.py migrate --noinput
          python manage.py preparar_demo_online
          python manage.py shell -c "import os; from django.test import Client; c=Client(HTTP_HOST='localhost', HTTP_X_FORWARDED_PROTO='https'); r=c.get('/salud/'); assert (r.status_code, r.content) == (200, b'OK'); assert c.login(username='estudiante_sena', password=os.getenv('MERITUM_SENA_ESTUDIANTE_PASSWORD')); assert c.get('/').status_code == 200"
